name: passenger
description: "TryGoRide passenger app."
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  signalr_netcore: ^1.4.4
  google_sign_in: ^6.3.0
  google_maps_flutter: ^2.12.3
  intl: ^0.20.2
  flutter_web_auth_2: ^5.1.0
  qr_flutter: ^4.1.0
  flutter_svg: ^2.3.0
  image_picker: ^1.2.3
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/app-icon.png
  adaptive_icon_background: "#F7941D"
  adaptive_icon_foreground: assets/app-icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo-circle.png
    - assets/app-icon.png
    - assets/vehicles/
